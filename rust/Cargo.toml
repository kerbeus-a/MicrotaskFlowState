[package]
name = "flowstate"
version = "1.1.0"
description = "FlowState - voice-first micro-task manager for Windows and Linux"
authors = ["FlowState Team"]
license = ""
repository = ""
edition = "2021"

[features]
default = ["native-ui"]
native-ui = ["eframe", "cpal"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"], optional = true }
cpal = { version = "0.15", optional = true }
whisper-rs = "0.16"
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
futures-util = "0.3"
sha2 = "0.10"
chrono = "0.4"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[bin]]
name = "flowstate"
path = "src/main.rs"
required-features = ["native-ui"]

[profile.release]
lto = "thin"
strip = true

# whisper-rs-sys always builds cmake's "Release" config, but in release mode cmake-rs also
# overwrites that config's flags and drops /O2 on MSVC (~5x slower transcription).
# Build scripts with debug assertions make it take its RelWithDebInfo path instead,
# which leaves the optimized Release flags intact.
[profile.release.build-override]
debug-assertions = true

# Optimize dependencies (whisper, candle) even in debug builds; on-device models are unusably slow otherwise.
[profile.dev.package."*"]
opt-level = 3

