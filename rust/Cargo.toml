[package]
name = "flowstate"
version = "1.0.0"
description = "FlowState - A lightweight Windows desktop app for managing micro-tasks"
authors = ["FlowState Team"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["native-ui"]
native-ui = ["eframe", "cpal"]

[build-dependencies]
winres = "0.1"

[dependencies]
# Native UI (optional - for egui)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"], optional = true }
cpal = { version = "0.15", optional = true }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls"] }
chrono = "0.4"
windows = { version = "0.52", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
hound = "3.5"

[[bin]]
name = "flowstate"
path = "src/native_main.rs"
required-features = ["native-ui"]
