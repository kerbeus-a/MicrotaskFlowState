name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rust/target/release/flowstate.exe
          - os: ubuntu-22.04
            artifact: rust/target/release/flowstate
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Start a CalDAV server for the sync test
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          pip install --quiet radicale
          python3 -m radicale --storage-filesystem-folder="$RUNNER_TEMP/radicale" \
            --auth-type=none --server-hosts=127.0.0.1:5232 > "$RUNNER_TEMP/radicale.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5232/.web/ && break; sleep 1; done
          echo "FLOWSTATE_CALDAV_URL=http://127.0.0.1:5232" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release

      - name: CalDAV server log
        if: failure() && runner.os == 'Linux'
        working-directory: .
        run: cat "$RUNNER_TEMP/radicale.log" || true

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ runner.os }}
          path: ${{ matrix.artifact }}

  fedora-rpm:
    runs-on: ubuntu-latest
    container: fedora:43
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Install Fedora build dependencies
        working-directory: /
        run: |
          dnf install -y git gcc gcc-c++ cmake clang clang-devel pkgconf-pkg-config \
            alsa-lib-devel libxkbcommon-devel wayland-devel libX11-devel \
            libXcursor-devel libXrandr-devel libXi-devel mesa-libGL-devel \
            rpm-build tar gzip zstd

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: fedora

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package RPM
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
          rpm -qip target/generate-rpm/*.rpm
          rpm -qlp target/generate-rpm/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: flowstate-fedora-rpm
          path: rust/target/generate-rpm/*.rpm
